appId: com.colab91.classifier
productName: Colab91 Classifier
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"

asarUnpack:
  - "node_modules/@duckdb/node-bindings*/**"

extraMetadata:
  main: dist/main/main/index.js

mac:
  category: public.app-category.business
  target:
    - dmg
    - zip

win:
  target:
    - nsis

nsis:
  oneClick: true
  allowToChangeInstallationDirectory: false
