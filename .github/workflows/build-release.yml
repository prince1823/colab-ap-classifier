name: Build Release

on:
  push:
    branches:
      - claude/fix-windows-duckdb-build-*
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. 0.1.0)'
        required: false
        default: ''

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
            args: --mac
          - os: windows-latest
            platform: win
            args: --win --x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify DuckDB native bindings
        shell: bash
        run: |
          echo "=== Installed @duckdb packages ==="
          ls node_modules/@duckdb/
          echo "=== Platform-specific bindings ==="
          find node_modules/@duckdb/ -name "*.node" -o -name "*.dll" -o -name "*.so" -o -name "*.dylib" 2>/dev/null || true

      - name: Build app
        run: npm run build

      - name: Package with electron-builder
        run: npx electron-builder ${{ matrix.args }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify unpacked native bindings
        shell: bash
        run: |
          echo "=== Checking for unpacked native modules ==="
          find release/ -name "*.node" -o -name "*.dll" -o -name "*.so" -o -name "*.dylib" 2>/dev/null || true
          echo "=== app-unpacked contents (if exists) ==="
          ls -la release/*/unpacked/node_modules/@duckdb/ 2>/dev/null || ls -la release/*-unpacked/resources/app.asar.unpacked/node_modules/@duckdb/ 2>/dev/null || echo "No unpacked dir found at expected paths"

      - name: Upload macOS DMG
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: release/*.dmg
          if-no-files-found: error

      - name: Upload macOS ZIP
        if: matrix.platform == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: macos-zip
          path: release/*.zip
          if-no-files-found: error

      - name: Upload Windows installer
        if: matrix.platform == 'win'
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          if-no-files-found: error
